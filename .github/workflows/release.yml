# GENERATED by tools/mirror-satellites.sh — edit there, not here.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.6)'
        required: true

permissions:
  contents: write

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The changelog diffs against the previous tag — needs full history.
          fetch-depth: 0
      - name: Publish release with standardized notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Notes are built into a file rather than passed as a multi-line
          # --notes string: inside a `run: |` block scalar EVERY line must stay
          # indented, and a quoted string continuing at column 0 silently ends
          # the block and makes the whole workflow file invalid.
          if [ -f scripts/release-notes.mjs ]; then
            node scripts/release-notes.mjs --tag "$TAG" --channel release --repo "$GITHUB_REPOSITORY" > release-notes.md
          else
            {
              printf '## %s\n\n' "$TAG"
              printf '`%s` at %s.\n\n' "safe-actions" "$TAG"
              printf 'Binaries for every platform are attached to this release.\n'
              printf 'Ryu as a whole lives at https://github.com/amajorai/ryu.\n'
            } > release-notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease=false --latest --notes-file release-notes.md
          else
            gh release create "$TAG" --latest --title "ryu-safe-actions $TAG" --target "$GITHUB_SHA" --notes-file release-notes.md
          fi

  build:
    needs: notes
    name: companion bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Test and build the Companion
        working-directory: sidecar
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run test
          bun run check-types
          bun run build
          test -f dist/index.html || { echo "Vite build did not produce dist/index.html" >&2; exit 1; }
      - name: Package the self-contained Companion
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          stage="$(mktemp -d)"
          mkdir -p "$stage/sidecar" out
          cp manifest.json "$stage/manifest.json"
          cp -r sidecar/dist "$stage/sidecar/dist"
          tar -czf "out/ryu-safe-actions-ui-${TAG}.tar.gz" -C "$stage" manifest.json sidecar/dist
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd out && sha256sum "ryu-safe-actions-ui-${TAG}.tar.gz" > "ryu-safe-actions-ui-${TAG}.tar.gz.sha256" )
          else
            ( cd out && shasum -a 256 "ryu-safe-actions-ui-${TAG}.tar.gz" > "ryu-safe-actions-ui-${TAG}.tar.gz.sha256" )
          fi
          # With shell pipefail enabled, grep -q closes the tar listing as soon as it finds
          # a match and tar exits on SIGPIPE. Consume the complete listing so
          # the archive-integrity check is stable on every runner.
          tar -tzf "out/ryu-safe-actions-ui-${TAG}.tar.gz" | grep -Fx 'manifest.json' >/dev/null
          tar -tzf "out/ryu-safe-actions-ui-${TAG}.tar.gz" | grep -Fx 'sidecar/dist/index.html' >/dev/null
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no files matched" >&2; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
