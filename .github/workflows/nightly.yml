# GENERATED by tools/mirror-satellites.sh — edit there, not here.
name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # HISTORY IS KEPT (changed 2026-08-04). This used to delete the `nightly` release
  # and its tag on every run and recreate one rolling release, so the channel only
  # ever held the newest build and every earlier one was destroyed. Each build now
  # publishes under its own versioned tag and the last $RETAIN are kept.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        name: Create this nightly prerelease, then prune old ones
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RETAIN: "14"
          # Optional. Unset = the changelog is the raw mirror-commit bullets,
          # which is already real content; set, they are merged into highlights.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          # This build's own version: <base>-nightly.<utc-date>.<run-number>, where the
          # base is the in-tree version advanced past any published stable release.
          # Ordered by semver precedence, so two rolling builds are comparable and a
          # prerelease always ranks below its finished stable.
          VERSION="$(node scripts/next-version.mjs nightly --in-tree 0.2.6)"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Nightly version: $VERSION (tag $TAG)"
          {
            printf '## Nightly `%s`\n\n' "$VERSION"
            printf 'Rolling **nightly** build of `ryu-safe-actions` from `main` — not a stable release.\n\n'
            printf 'Built from commit %s.\n\n' "${GITHUB_SHA}"
            printf 'Installed Ryu nodes never auto-update onto rolling builds; the updater only\n'
            printf 'tracks the latest tagged v* release. Use the tagged releases for anything real.\n'
          } > notes.md
          # Banner above, real changelog here. Read from this repo's own mirror
          # commit bodies; never fails the build.
          node scripts/rolling-notes.mjs --channel nightly --repo "$GITHUB_REPOSITORY" >> notes.md
          # The tag now CARRIES the version, so `release_version` (apps/core/src/update/mod.rs)
          # reads it off the tag and only falls back to scanning this title. The title
          # keeps its shape regardless: it is what a human reads, and it is still the
          # fallback. --prerelease is load-bearing — `/releases/latest` excludes
          # prereleases, which is what keeps stable nodes off rolling builds.
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Nightly $VERSION (${GITHUB_SHA:0:12})" --notes-file notes.md
          # Keep the newest $RETAIN builds on this channel; delete the rest with their
          # tags. Matching the tag SHAPE means this can never touch a v* stable release.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --exclude-drafts \
            --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\."))]
                  | sort_by(.createdAt) | reverse | .['"$RETAIN"':][] | .tagName' \
            > stale.txt || true
          while read -r old; do
            [ -n "$old" ] || continue
            echo "pruning old nightly release $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done < stale.txt
          # Retire the pre-2026-08-04 unversioned rolling release once.
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

  build:
    needs: prepare
    name: companion bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - name: Test and build the Companion
        working-directory: sidecar
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run test
          bun run check-types
          bun run build
          test -f dist/index.html || { echo "Vite build did not produce dist/index.html" >&2; exit 1; }
      - name: Package the self-contained Companion
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          stage="$(mktemp -d)"
          mkdir -p "$stage/sidecar" out
          cp manifest.json "$stage/manifest.json"
          cp -r sidecar/dist "$stage/sidecar/dist"
          tar -czf "out/ryu-safe-actions-ui-${TAG}.tar.gz" -C "$stage" manifest.json sidecar/dist
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd out && sha256sum "ryu-safe-actions-ui-${TAG}.tar.gz" > "ryu-safe-actions-ui-${TAG}.tar.gz.sha256" )
          else
            ( cd out && shasum -a 256 "ryu-safe-actions-ui-${TAG}.tar.gz" > "ryu-safe-actions-ui-${TAG}.tar.gz.sha256" )
          fi
          # With shell pipefail enabled, grep -q closes the tar listing as soon as it finds
          # a match and tar exits on SIGPIPE. Consume the complete listing so
          # the archive-integrity check is stable on every runner.
          tar -tzf "out/ryu-safe-actions-ui-${TAG}.tar.gz" | grep -Fx 'manifest.json' >/dev/null
          tar -tzf "out/ryu-safe-actions-ui-${TAG}.tar.gz" | grep -Fx 'sidecar/dist/index.html' >/dev/null
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no files matched" >&2; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
